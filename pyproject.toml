[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bunny-cli"
version = "0.1.0"
description = "A complete CLI for bunny.net - CDN, DNS, Storage, and more"
readme = "README.md"
license = "MIT"
authors = [
    { name = "After Dark Systems, LLC", email = "dev@afterdarksys.com" }
]
keywords = ["bunny", "cdn", "dns", "cli", "bunnynet", "edge"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: System :: Networking",
    "Topic :: Utilities",
]
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "httpx>=0.25",
    "rich>=13.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "mypy>=1.0",
]

[project.scripts]
bunny = "bunny_cli.main:cli"

[project.urls]
Homepage = "https://github.com/straticus1/bunny-cli"
Documentation = "https://github.com/straticus1/bunny-cli#readme"
Repository = "https://github.com/straticus1/bunny-cli"
Issues = "https://github.com/straticus1/bunny-cli/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/bunny_cli"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.9"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
